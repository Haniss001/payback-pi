<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payback Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
Pi.init({ version: "2.0", sandbox: false });

// Функција која автоматски се извршува кога ќе се најде заглавено плаќање при автентикација
function onIncompletePaymentFound(payment) {
console.log("Incomplete payment found:", payment);
if (payment && payment.identifier) {
// Праќаме барање до Vercel бекендот да го затвори/комлетира заглавеното плаќање
const txid = (payment.transaction && payment.transaction.txid) ? payment.transaction.txid : "resolved-by-dev";

fetch("/api/complete", {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ paymentId: payment.identifier, txid: txid })
})
.then(res => res.json())
.then(data => {
alert("Заглавената трансакција е успешно исчистена од серверот!");
location.reload();
})
.catch(err => {
console.error("Error clearing payment:", err);
});
}
}

function makePayment() {
const scopes = ['username', 'payments'];

// Тука ја вклучуваме функцијата за недовршени плаќања
Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
const paymentData = {
amount: 0.1,
memo: "Test payment for Payback Pi",
metadata: { productId: "test-01" }
};

const callbacks = {
onReadyForServerApproval: function(paymentId) {
fetch("/api/approve", {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ paymentId: paymentId })
}).then(res => res.json())
.then(data => console.log("Approved:", data));
},
onReadyForServerCompletion: function(paymentId, txid) {
fetch("/api/complete", {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ paymentId: paymentId, txid: txid })
}).then(res => res.json())
.then(data => alert("Плаќањето е успешно завршено!"));
},
onCancel: function(paymentId) {
console.log("Cancelled:", paymentId);
},
onError: function(error, payment) {
alert("Грешка: " + (error ? error.message : "Непозната грешка"));
}
};

Pi.createPayment(paymentData, callbacks);
}).catch(function(err) {
alert("Auth Error: " + JSON.stringify(err));
});
}
</script>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; background:#f4f4f9;">
<div style="text-align:center;">
<h1>Payback Pi App</h1>
<p>Welcome to Payback Pi!</p>
<button onclick="makePayment()" style="padding:12px 24px; font-size:16px; background:#8a2be2; color:white; border:none; border-radius:5px; cursor:pointer;">
Test Pi Payment
</button>
</div>
</body>
</html>
