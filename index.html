<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payback Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
Pi.init({ version: "2.0", sandbox: true });

const API_KEY = "wdstjzheqklgo8vi3b5tohwhgy1fsfkmdqh43hbacfomieqjvpx8aozt2zzma8yr";

function makePayment() {
const scopes = ['username', 'payments'];

function onIncompletePaymentFound(payment) {
console.log("Incomplete payment found:", payment);
if (payment.identifier) {
fetch("https://corsproxy.io/?" + encodeURIComponent(`https://api.minepi.com/v2/payments/${payment.identifier}/complete`), {
method: 'POST',
headers: {
'Authorization': 'Key ' + API_KEY,
'Content-Type': 'application/json'
},
body: JSON.stringify({ txid: payment.transaction ? payment.transaction.txid : "incomplete" })
});
}
}

Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
const paymentData = {
amount: 0.1,
memo: "Test payment for Payback Pi",
metadata: { productId: "test-01" }
};

const callbacks = {
onReadyForServerApproval: function(paymentId) {
console.log("Approving payment:", paymentId);
fetch("https://corsproxy.io/?" + encodeURIComponent(`https://api.minepi.com/v2/payments/${paymentId}/approve`), {
method: 'POST',
headers: {
'Authorization': 'Key ' + API_KEY,
'Content-Type': 'application/json'
}
}).then(res => res.json())
.then(data => console.log("Approved:", data))
.catch(err => console.error("Approval error:", err));
},
onReadyForServerCompletion: function(paymentId, txid) {
console.log("Completing payment:", paymentId, txid);
fetch("https://corsproxy.io/?" + encodeURIComponent(`https://api.minepi.com/v2/payments/${paymentId}/complete`), {
method: 'POST',
headers: {
'Authorization': 'Key ' + API_KEY,
'Content-Type': 'application/json'
},
body: JSON.stringify({ txid: txid })
}).then(res => res.json())
.then(data => alert("Успешно завршено плаќање!"))
.catch(err => console.error("Completion error:", err));
},
onCancel: function(paymentId) {
console.log("Cancelled:", paymentId);
},
onError: function(error, payment) {
console.error("Error:", error);
}
};

Pi.createPayment(paymentData, callbacks);
}).catch(function(err) {
console.error("Auth error:", err);
});
}
</script>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; background:#f4f4f9;">
<div style="text-align:center;">
<h1>Payback Pi App</h1>
<p>Welcome to Payback Pi Sandbox Test!</p>
<button onclick="makePayment()" style="padding:12px 24px; font-size:16px; background:#8a2be2; color:white; border:none; border-radius:5px; cursor:pointer;">
Test Pi Payment
</button>
</div>
</body>
</html>
