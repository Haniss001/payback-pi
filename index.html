<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payback Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
Pi.init({ version: "2.0", sandbox: true });

const API_KEY = "wdstjzheqklgo8vi3b5tohwhgy1fsfkmdqh43hbacfomieqjvpx8aozt2zzma8yr";

function approvePayment(paymentId) {
const xhr = new XMLHttpRequest();
xhr.open("POST", "https://api.sandbox.minepi.com/v2/payments/" + paymentId + "/approve", true);
xhr.setRequestHeader("Authorization", "Key " + API_KEY);
xhr.setRequestHeader("Content-Type", "application/json");
xhr.onreadystatechange = function () {
if (xhr.readyState === 4) {
console.log("Approve response:", xhr.responseText);
}
};
xhr.send();
}

function completePayment(paymentId, txid) {
const xhr = new XMLHttpRequest();
xhr.open("POST", "https://api.sandbox.minepi.com/v2/payments/" + paymentId + "/complete", true);
xhr.setRequestHeader("Authorization", "Key " + API_KEY);
xhr.setRequestHeader("Content-Type", "application/json");
xhr.onreadystatechange = function () {
if (xhr.readyState === 4) {
console.log("Complete response:", xhr.responseText);
alert("Payment Completed!");
}
};
xhr.send(JSON.stringify({ txid: txid }));
}

function makePayment() {
const scopes = ['username', 'payments'];

function onIncompletePaymentFound(payment) {
console.log("Incomplete payment found:", payment);
if (payment.identifier && payment.transaction) {
completePayment(payment.identifier, payment.transaction.txid);
}
}

Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
const paymentData = {
amount: 0.1,
memo: "Test payment for Payback Pi",
metadata: { productId: "test-01" }
};

const callbacks = {
onReadyForServerApproval: function(paymentId) {
console.log("OnReadyForServerApproval called with ID:", paymentId);
approvePayment(paymentId);
},
onReadyForServerCompletion: function(paymentId, txid) {
console.log("OnReadyForServerCompletion called:", paymentId, txid);
completePayment(paymentId, txid);
},
onCancel: function(paymentId) {
console.log("Cancelled:", paymentId);
},
onError: function(error, payment) {
console.error("Error:", error);
}
};

Pi.createPayment(paymentData, callbacks);
}).catch(function(err) {
console.error("Auth error:", err);
});
}
</script>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; background:#f4f4f9;">
<div style="text-align:center;">
<h1>Payback Pi App</h1>
<p>Welcome to Payback Pi Sandbox!</p>
<button onclick="makePayment()" style="padding:12px 24px; font-size:16px; background:#8a2be2; color:white; border:none; border-radius:5px; cursor:pointer;">
Test Pi Payment
</button>
</div>
</body>
</html>
